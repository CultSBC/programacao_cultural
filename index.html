<script>
/* =========================
   ESTADO GLOBAL
========================= */

let currentTab = 'dashboard';
let eventos = [];
let editIndex = null;

/* =========================
   API GOOGLE SHEETS
========================= */

const API_URL = 'https://script.google.com/macros/s/AKfycbyYDvsvRyuOA69qj_Q90328oZyxqR2mcGOK91VOYZk2kzp7ibteVL1QakPsdGnRL1pv/exec';

async function carregarEventosDaAPI() {
    try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        eventos = data.map(row => ({
            nome: row['Nome da Proposta'] || '',
            local: row['Local'] || '',
            dataInicio: row['Início'] || '',
            dataFim: row['Fim'] || '',
            horarioInicio: row['Horário Início'] || '',
            horarioFim: row['Horário Fim'] || '',
            status: row['Status do Evento'] || 'em análise',
            solicitante: row['Solicitante'] || '',
            publico: Number(row['Público Alcançado'] || 0),
            descricao: row['O que será realizado? Breve descrição.'] || ''
        }));
        
        atualizarDashboard();
        renderTabela();
        console.log('Eventos carregados:', eventos.length);
    } catch (error) {
        console.error('Erro ao carregar eventos:', error);
        alert('Erro ao carregar dados da planilha. Verifique a conexão.');
    }
}

async function salvarEventoNaAPI(evento) {
    try {
        const dadosParaPlanilha = {
            'Nome da Proposta': evento.nome,
            'Local': evento.local,
            'Início': evento.dataInicio,
            'Fim': evento.dataFim,
            'Status do Evento': evento.status,
            'Solicitante': evento.solicitante,
            'Público Alcançado': evento.publico
        };
        
        const response = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(dadosParaPlanilha)
        });
        
        const result = await response.json();
        
        if (result.success) {
            alert('Evento salvo com sucesso!');
            await carregarEventosDaAPI();
        }
    } catch (error) {
        console.error('Erro ao salvar evento:', error);
        alert('Erro ao salvar na planilha.');
    }
}

/* =========================

========================= */

    "PNAB 2024",

function preencherSelect(id, lista) {
    const select = document.getElementById(id);
    if (!select) return;
    select.innerHTML = '<option value="">Selecione</option>';
    lista.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item;
        opt.textContent = item;
        select.appendChild(opt);
    });
}

/* =========================
   NAVEGAÇÃO
========================= */

function showTab(tab) {
    currentTab = tab;
    document.getElementById('dashboardContent').classList.add('hidden');
    document.getElementById('eventosContent').classList.add('hidden');
    document.getElementById('calendarioContent').classList.add('hidden');
    document.getElementById('relatoriosContent').classList.add('hidden');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

    if (tab === 'dashboard') {
        document.getElementById('dashboardContent').classList.remove('hidden');
        document.getElementById('pageTitle').innerText = 'Dashboard';
    }
    if (tab === 'eventos') {
        document.getElementById('eventosContent').classList.remove('hidden');
        document.getElementById('pageTitle').innerText = 'Eventos';
        renderTabela();
    }
    if (tab === 'calendario') {
        document.getElementById('calendarioContent').classList.remove('hidden');
        document.getElementById('pageTitle').innerText = 'Calendário';
        renderCalendario();
    }
    if (tab === 'relatorios') {
        document.getElementById('relatoriosContent').classList.remove('hidden');
        document.getElementById('pageTitle').innerText = 'Relatórios';
        atualizarRelatorios();
    }

    const navItems = document.querySelectorAll('.nav-item');
    navItems.forEach(item => {
        if (item.getAttribute('onclick') && item.getAttribute('onclick').includes(tab)) {
            item.classList.add('active');
        }
    });
}

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('collapsed');
}

/* =========================
   MODAL
========================= */

function openModal() {
    editIndex = null;
    document.getElementById('modalTitle').innerText = 'Novo Evento';
    document.getElementById('eventModal').classList.add('active');
}

function closeModal() {
    document.getElementById('eventModal').classList.remove('active');
    limparFormulario();
}

function toggleSection(header) {
    header.parentElement.classList.toggle('expanded');
}

/* =========================
   FORMULÁRIO
========================= */

function limparFormulario() {
    document.querySelectorAll('#eventModal input, #eventModal textarea, #eventModal select').forEach(el => {
        if (el.type === 'checkbox') el.checked = false;
        else el.value = '';
    });
}

async function saveEvent() {
    const evento = {
        nome: document.getElementById('nomeProposta').value,
        local: document.getElementById('local').value,
        dataInicio: document.getElementById('dataInicio').value,
        dataFim: document.getElementById('dataFim').value,
        horarioInicio: document.getElementById('horarioInicio').value,
        horarioFim: document.getElementById('horarioFim').value,
        status: document.getElementById('status').value,
        solicitante: document.getElementById('solicitante').value,
        publico: Number(document.getElementById('publicoAlcancado').value || 0)
    };

    if (!evento.nome || !evento.local || !evento.dataInicio) {
        alert('Preencha os campos obrigatórios.');
        return;
    }

    if (editIndex !== null) {
        eventos[editIndex] = evento;
        closeModal();
        atualizarDashboard();
        renderTabela();
        alert('Evento atualizado localmente.');
    } else {
        await salvarEventoNaAPI(evento);
        closeModal();
    }
}

/* =========================
   TABELA
========================= */

function renderTabela() {
    const tbody = document.getElementById('eventosTableBody');
    tbody.innerHTML = '';

    if (eventos.length === 0) {
        document.getElementById('emptyState').classList.remove('hidden');
        return;
    }

    document.getElementById('emptyState').classList.add('hidden');

    eventos.forEach((e, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${e.nome}</td>
            <td>${e.local}</td>
            <td>${e.dataInicio}</td>
            <td>${e.horarioInicio || '-'}</td>
            <td><span class="status-badge status-${(e.status || '').replaceAll(' ', '-')}">${e.status}</span></td>
            <td>${e.solicitante || '-'}</td>
            <td>${e.publico || 0}</td>
            <td class="table-actions">
                <button class="icon-btn blue" onclick="editarEvento(${i})">✏️</button>
                <button class="icon-btn red" onclick="excluirEvento(${i})">🗑️</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

function editarEvento(index) {
    const e = eventos[index];
    editIndex = index;
    document.getElementById('nomeProposta').value = e.nome;
    document.getElementById('local').value = e.local;
    document.getElementById('dataInicio').value = e.dataInicio;
    document.getElementById('dataFim').value = e.dataFim;
    document.getElementById('horarioInicio').value = e.horarioInicio;
    document.getElementById('horarioFim').value = e.horarioFim;
    document.getElementById('status').value = e.status;
    document.getElementById('solicitante').value = e.solicitante;
    document.getElementById('publicoAlcancado').value = e.publico;
    document.getElementById('modalTitle').innerText = 'Editar Evento';
    document.getElementById('eventModal').classList.add('active');
}

function excluirEvento(index) {
    if (confirm('Deseja excluir este evento?')) {
        eventos.splice(index, 1);
        renderTabela();
        atualizarDashboard();
    }
}

/* =========================
   DASHBOARD
========================= */

function atualizarDashboard() {
    document.getElementById('statTotal').innerText = eventos.length;
    document.getElementById('statAprovados').innerText = eventos.filter(e => e.status === 'aprovado').length;
    document.getElementById('statEmAnalise').innerText = eventos.filter(e => e.status === 'em análise').length;
    document.getElementById('statConcluidos').innerText = eventos.filter(e => e.status === 'concluído').length;
    document.getElementById('statCancelados').innerText = eventos.filter(e => e.status === 'cancelado').length;
    document.getElementById('statData').innerText = eventos.filter(e => e.status === 'alterou a data').length;
    document.getElementById('statLocal').innerText = eventos.filter(e => e.status === 'alterou o local').length;
}

/* =========================
   FILTROS
========================= */

function clearFilters() {
    document.getElementById('filterBusca').value = '';
    document.getElementById('filterStatus').value = '';
    document.getElementById('filterLocal').value = '';
    document.getElementById('filterDataInicio').value = '';
    document.getElementById('filterDataFim').value = '';
    renderTabela();
}

function exportToExcel() {
    alert('Funcionalidade de exportação em desenvolvimento.');
}

/* =========================
   RELATÓRIOS
========================= */

function atualizarRelatorios() {
    const total = eventos.length;
    const publico = eventos.reduce((s, e) => s + (e.publico || 0), 0);
    const aprovados = eventos.filter(e => e.status === 'aprovado').length;
    document.getElementById('relTotal').innerText = total;
    document.getElementById('relPublico').innerText = publico;
    document.getElementById('relTaxa').innerText = total ? Math.round((aprovados / total) * 100) + '%' : '0%';
    document.getElementById('relMedia').innerText = total ? Math.round(publico / total) : 0;
}

/* =========================
   CALENDÁRIO
========================= */

let calendarDate = new Date();
let calendarView = 'monthly';

function navegarCalendario(direction) {
    if (direction === 0) {
        calendarDate = new Date();
    } else if (calendarView === 'monthly') {
        calendarDate.setMonth(calendarDate.getMonth() + direction);
    } else {
        calendarDate.setDate(calendarDate.getDate() + (direction * 7));
    }
    renderCalendario();
}

function mudarVisualizacao() {
    calendarView = calendarView === 'monthly' ? 'weekly' : 'monthly';
    document.getElementById('viewToggleText').innerText = 
        calendarView === 'monthly' ? 'Visualização Semanal' : 'Visualização Mensal';
    renderCalendario();
}

function renderCalendario() {
    const monthNames = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 
                        'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
    document.getElementById('calendarMonth').innerText = 
        `${monthNames[calendarDate.getMonth()]} ${calendarDate.getFullYear()}`;
    
    const container = document.getElementById('calendarContainer');
    container.className = 'calendar-grid';
    container.innerHTML = '';
    
    ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].forEach(dia => {
        const header = document.createElement('div');
        header.className = 'calendar-day-header';
        header.innerText = dia;
        container.appendChild(header);
    });
    
    if (calendarView === 'monthly') {
        renderMensal(container);
    } else {
        renderSemanal(container);
    }
}

function renderMensal(container) {
    const year = calendarDate.getFullYear();
    const month = calendarDate.getMonth();
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    
    for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'calendar-day';
        container.appendChild(empty);
    }
    
    for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayEvents = eventos.filter(e => e.dataInicio === dateStr);
        
        const dayCell = document.createElement('div');
        dayCell.className = 'calendar-day' + (dayEvents.length > 0 ? ' has-events' : '');
        dayCell.innerHTML = `
            <div class="calendar-day-number">${day}</div>
            ${dayEvents.slice(0, 3).map(e => `<div class="calendar-event">${e.nome}</div>`).join('')}
            ${dayEvents.length > 3 ? `<div class="calendar-event">+${dayEvents.length - 3} mais</div>` : ''}
        `;
        container.appendChild(dayCell);
    }
}

function renderSemanal(container) {
    const startOfWeek = new Date(calendarDate);
    startOfWeek.setDate(calendarDate.getDate() - calendarDate.getDay());
    
    for (let i = 0; i < 7; i++) {
        const currentDay = new Date(startOfWeek);
        currentDay.setDate(startOfWeek.getDate() + i);
        const dateStr = currentDay.toISOString().split('T')[0];
        const dayEvents = eventos.filter(e => e.dataInicio === dateStr);
        
        const dayCell = document.createElement('div');
        dayCell.className = 'calendar-day' + (dayEvents.length > 0 ? ' has-events' : '');
        dayCell.style.minHeight = '200px';
        dayCell.innerHTML = `
            <div class="calendar-day-number">${currentDay.getDate()}/${currentDay.getMonth() + 1}</div>
            ${dayEvents.map(e => `<div class="calendar-event" style="white-space: normal;">${e.nome}<br><small>${e.horarioInicio || ''}</small></div>`).join('')}
        `;
        container.appendChild(dayCell);
    }
}

/* =========================
   INIT
========================= */

document.addEventListener('DOMContentLoaded', async () => {
    preencherSelect('eventoChegouAtraves', LISTA_ORIGEM_EVENTO);
    preencherSelect('local', LISTA_LOCAIS);
    preencherSelect('filterLocal', LISTA_LOCAIS);
    await carregarEventosDaAPI();
    renderCalendario();
});
</script>
